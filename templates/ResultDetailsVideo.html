<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <link rel="icon" href="data:,">
    
    <meta charset="utf-8" />
    <title>Exam Result Details - {% if filename.endswith('.wav') %}Audio{% else %}Video{% endif %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      type="text/css"
      href="{{url_for('static', filename='css/VideoPlayer.css')}}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body style="flex-direction: column; padding: 20px;">
    {% if filename.endswith('.wav') %}
    <div class="audio-card" style="background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); max-width: 600px; width: 95%; text-align: center;">
      <i class="fa-solid fa-microphone-lines" style="font-size: 50px; color: #3c91e6; margin-bottom: 15px;"></i>
      <h2 style="margin-bottom: 10px; color: #333; font-size: 22px;">Proctoring Audio Evidence</h2>
      <p style="color: #666; margin-bottom: 25px; font-size: 14px; word-break: break-all;"><strong>File:</strong> {{ filename }}</p>
      <audio controls autoplay style="width: 100%; border-radius: 8px; outline: none;">
        <source src="{{ mediaPath }}" type="audio/wav" />
        Your browser does not support the audio element.
      </audio>
    </div>
    {% else %}
    <div class="container show-controls">
      <div class="wrapper">
        <div class="video-timeline">
          <div class="progress-area">
            <span>00:00</span>
            <div class="progress-bar"></div>
          </div>
        </div>
        <ul class="video-controls">
          <li class="options left">
            <button class="volume">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <input type="range" min="0" max="1" step="any" />
            <div class="video-timer">
              <p class="current-time">00:00</p>
              <p class="separator">/</p>
              <p class="video-duration">00:00</p>
            </div>
          </li>
          <li class="options center">
            <button class="skip-backward">
              <i class="fas fa-backward"></i>
            </button>
            <button class="play-pause"><i class="fas fa-play"></i></button>
            <button class="skip-forward"><i class="fas fa-forward"></i></button>
          </li>
          <li class="options right">
            <div class="playback-content">
              <button class="playback-speed">
                <span class="material-symbols-rounded">slow_motion_video</span>
              </button>
              <ul class="speed-options">
                <li data-speed="2">2x</li>
                <li data-speed="1.5">1.5x</li>
                <li data-speed="1" class="active">Normal</li>
                <li data-speed="0.75">0.75x</li>
                <li data-speed="0.5">0.5x</li>
              </ul>
            </div>
            <button class="pic-in-pic">
              <span class="material-icons">picture_in_picture_alt</span>
            </button>
            <button class="fullscreen">
              <i class="fa-solid fa-expand"></i>
            </button>
          </li>
        </ul>
      </div>

      <video src="{{ mediaPath }}" controls></video>
      <div style="margin-top: 15px; text-align: center;"><a href="{{ mediaPath }}" download class="btn" style="background:#3c91e6; color:#fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px;"><i class="fas fa-download"></i> Download Video Clip</a></div>
    </div>
    <script src="{{ url_for('static', filename='js/VideoPlayer.js') }}"></script>
    {% endif %}

    <div class="link-button" style="text-align: center; margin-top: 25px;">
      <a href="{{ url_for('adminResultDetails', resultId=resultId) }}" style="text-decoration: none; font-size: 16px; color: #222; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; background: #fff; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.06);">
        <i class="fas fa-arrow-left"></i> Back to Result Details
      </a>
    </div>
  </body>
</html>
