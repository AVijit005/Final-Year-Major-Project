<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
        <link rel="stylesheet" href="{{url_for('static', filename='css/bootstrap.min.css')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/quiz.css')}}">
         <script src="{{url_for('static', filename='js/jquery-3.6.0.min.js')}}"></script>
        <title>Exam</title>
    </head>
    <body>
     <header>
        <nav class="navbar navbar-expand-md" >
            <span class="text">The Online Exam Proctor</span>

            <span class="ml-auto" id="timer"></span>
        </nav>
    </header>
    <main>

        <br>
        <br>
        <div class="container">
            <a class="btn btn-outline-info rounded" style="display: none;" id = "navhighscorelink" >High Scores</a>
            <div class="card mt-5" >
                <div class="card-body">
                    <h2 class="card-title mb-4 text-center" id="title" style="color: #5f9ea0;">Exam Test</h2>
                    <hr class="line">
                    <div class="row">
                        <div class="col-md-1"></div>

                        <div class="col-md-10">

                            <div id="mainContent">

                                <h5 class="text-center">
                                    Answer the following questions within the time limit. Keep in mind that incorrect answers will penalize your time by 10 seconds!
                                </h5>

                                <div class="text-center">
                                    <button type="submit" id="startQuiz" class="btn text-white rounded-pill mb-2 mt-2" style="background: #5f9ea0;">Start Quiz</button>
                                </div>

                            </div>

                            <div id = "quizContent" ></div>
                            <div id = "completeTest"></div>

                        </div>
                    </div>

                    <div id="answer">
                         <hr class="line">
                    </div>

                </div>
            </div>

        </div>
        <br/>

        <footer>
            <p>&copy; The Online Exam Proctor System</p>
        </footer>
    </main>


    <script src="{{url_for('static', filename='js/questions.js')}}"></script>
    <script src="{{url_for('static', filename='js/script.js')}}"></script>
    <script src="{{url_for('static', filename='js/bootstrap.bundle.min.js')}}"></script>
    
    </body>

</html>
